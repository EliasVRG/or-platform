version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: or-platform-db
    environment:
      POSTGRES_USER: ${DB_USER:-orplatform}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-dev123}
      POSTGRES_DB: ${DB_NAME:-or_platform}
    ports:
      - '${DB_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER:-orplatform}']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - or-network

volumes:
  postgres_data:

networks:
  or-network:
    driver: bridge
